[platformio]
default_envs = waveshare_amoled_216

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
  +<dashboard_model.cpp>
  +<management_model.cpp>
  +<management_protocol.cpp>
  +<provider_visuals.cpp>
  +<protocol.cpp>
  +<settings_codec.cpp>
  +<settings_model.cpp>
  +<ui_layout.cpp>
  +<ui_format.cpp>
build_flags =
  -I include
  -std=gnu++17
lib_deps =
  bblanchon/ArduinoJson@7.4.3

[env:waveshare_amoled_216]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_upload.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.partitions = default_16MB.csv
build_flags =
  -I include
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D AGENTMETER_VERSION=\"0.1.0\"
  -D LV_CONF_INCLUDE_SIMPLE
  -std=gnu++17
build_unflags =
  -std=gnu++11
lib_deps =
  lvgl/lvgl@9.5.0
  bblanchon/ArduinoJson@7.4.3
  h2zero/NimBLE-Arduino@2.5.0
  moononournation/GFX Library for Arduino@1.6.7
  lewisxhe/XPowersLib@0.2.7
  lewisxhe/SensorLib@0.2.6
