name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Native macOS application
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Swift tests
        run: swift test --package-path desktop

      - name: Build application bundle
        run: desktop/scripts/package-app.sh

  host:
    name: Host application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check style
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PlatformIO
        run: python -m pip install "platformio>=6.1,<7"

      - name: Build firmware
        run: pio run -d firmware

      - name: Run native firmware tests
        run: pio test -d firmware -e native
