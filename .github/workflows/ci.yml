name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Native macOS application
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install bridge packager
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[package]"

      - name: Run Swift tests
        run: swift test --package-path desktop

      - name: Build application bundle
        run: desktop/scripts/package-app.sh

      - name: Build and verify community disk image
        run: |
          desktop/scripts/create-community-dmg.sh
          desktop/scripts/verify-community-release.sh

      - name: Test bundled bridge contract
        run: |
          runtime="$RUNNER_TEMP/agentmeter-bundled"
          mkdir -p "$runtime"
          chmod 700 "$runtime"
          helper="desktop/dist/AgentMeter.app/Contents/Resources/AgentMeterBridge/AgentMeterBridge"
          "$helper" fake-server --scenario connected-usb --ipc-path "$runtime/bridge.sock" &
          helper_pid=$!
          trap 'kill "$helper_pid" 2>/dev/null || true' EXIT
          for attempt in {1..50}; do
            [[ -S "$runtime/bridge.sock" ]] && break
            sleep 0.1
          done
          AGENTMETER_IPC_TEST_PATH="$runtime/bridge.sock" \
            swift test --package-path desktop --filter unixClientIntegration

  host:
    name: Host application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Check style
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests
        run: pytest

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PlatformIO
        run: python -m pip install "platformio>=6.1,<7"

      - name: Build firmware
        run: pio run -d firmware

      - name: Run native firmware tests
        run: pio test -d firmware -e native
