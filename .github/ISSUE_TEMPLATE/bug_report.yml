name: Bug report
description: Report a reproducible problem with AgentMeter.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve AgentMeter. Please remove account identifiers and credentials from logs.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Desktop host
        - Firmware or display
        - Bluetooth or USB connection
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start AgentMeter with ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Include AgentMeter version, operating system, and board revision.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, email addresses, and other private information before posting.
      render: shell

